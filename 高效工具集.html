<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网址收藏夹</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        neutral: '#f1f5f9',
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .btn-primary {
                @apply bg-primary text-white px-4 py-2 rounded-md hover:bg-primary/90 transition-all duration-200;
            }
            .btn-outline {
                @apply border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-200;
            }
            .input-field {
                @apply border border-gray-300 rounded-md px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fa fa-bookmark text-primary text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800">网址收藏夹</h1>
            </div>
            
            <div class="flex flex-wrap gap-3 w-full md:w-auto justify-end">
                <button id="categoryManageBtn" class="btn-outline flex items-center gap-2">
                    <i class="fa fa-tags"></i>
                    <span>管理分类</span>
                </button>
                <button id="importBtn" class="btn-outline flex items-center gap-2">
                    <i class="fa fa-upload"></i>
                    <span>导入Excel</span>
                </button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
                <button id="exportBtn" class="btn-outline flex items-center gap-2">
                    <i class="fa fa-download"></i>
                    <span>导出Excel</span>
                </button>
                <button id="addBtn" class="btn-primary flex items-center gap-2">
                    <i class="fa fa-plus"></i>
                    <span>添加网址</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
        <!-- 搜索和分类筛选 -->
        <div class="bg-white rounded-lg p-4 mb-6 shadow-sm">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜索网站名称或网址..." 
                        class="input-field pl-10"
                    >
                </div>
                <div class="w-full md:w-48">
                    <select id="categoryFilter" class="input-field">
                        <option value="all">所有分类</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 分类标签 -->
        <div class="flex flex-wrap gap-2 mb-6" id="categoryTags">
            <!-- 分类标签会动态生成 -->
        </div>

        <!-- 网址列表 -->
        <div id="bookmarkList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 网址卡片会动态生成 -->
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center">
            <i class="fa fa-folder-open-o text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-medium text-gray-500 mb-2">暂无收藏的网址</h3>
            <p class="text-gray-400 mb-6">点击"添加网址"按钮开始收藏你的第一个网站</p>
            <button id="emptyAddBtn" class="btn-primary">
                <i class="fa fa-plus mr-2"></i>添加网址
            </button>
        </div>
    </main>

    <!-- 添加/编辑网址模态框 -->
    <div id="bookmarkModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-800">添加网址</h2>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <form id="bookmarkForm">
                <input type="hidden" id="bookmarkId">
                
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">网站名称 <span class="text-danger">*</span></label>
                    <input type="text" id="name" class="input-field" required>
                </div>
                
                <div class="mb-4">
                    <label for="url" class="block text-sm font-medium text-gray-700 mb-1">网址 <span class="text-danger">*</span></label>
                    <input type="url" id="url" class="input-field" required placeholder="https://">
                </div>
                
                <div class="mb-4">
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">说明</label>
                    <textarea id="description" rows="2" class="input-field" placeholder="简单描述一下这个网站..."></textarea>
                </div>
                
                <div class="mb-6">
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                    <select id="category" class="input-field">
                        <option value="未分类">未分类</option>
                    </select>
                </div>
                
                <div class="flex gap-3 justify-end">
                    <button type="button" id="cancelBtn" class="btn-outline">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 分类管理模态框 -->
    <div id="categoryModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">管理分类</h2>
                <button id="closeCategoryModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <div class="flex gap-2">
                    <input type="text" id="newCategory" placeholder="输入新分类名称" class="input-field">
                    <button id="addCategoryBtn" class="btn-primary whitespace-nowrap">添加</button>
                </div>
            </div>
            
            <div id="categoryList" class="max-h-60 overflow-y-auto mb-4">
                <!-- 分类项会动态生成 -->
            </div>
            
            <div class="text-sm text-gray-500 mb-6">
                <p>提示：删除分类不会删除该分类下的网址，它们会被移至"未分类"</p>
            </div>
            
            <div class="flex justify-end">
                <button id="closeCategoryBtn" class="btn-outline">关闭</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-md shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2">
        <i id="toastIcon" class="fa fa-check-circle text-white"></i>
        <span id="toastMessage" class="text-white"></span>
    </div>

    <script>
        // 数据存储
        let bookmarks = [];
        let categories = ['未分类'];

        // DOM 元素
        const bookmarkList = document.getElementById('bookmarkList');
        const emptyState = document.getElementById('emptyState');
        const categoryTags = document.getElementById('categoryTags');
        const categoryFilter = document.getElementById('categoryFilter');
        const searchInput = document.getElementById('searchInput');
        const bookmarkModal = document.getElementById('bookmarkModal');
        const categoryModal = document.getElementById('categoryModal');
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');

        // 初始化
        function init() {
            loadFromLocalStorage();
            renderAll();
            setupEventListeners();
        }

        // 从本地存储加载数据
        function loadFromLocalStorage() {
            const savedBookmarks = localStorage.getItem('bookmarks');
            const savedCategories = localStorage.getItem('categories');
            
            if (savedBookmarks) {
                bookmarks = JSON.parse(savedBookmarks);
            }
            
            if (savedCategories) {
                categories = JSON.parse(savedCategories);
                // 确保"未分类"始终存在
                if (!categories.includes('未分类')) {
                    categories.unshift('未分类');
                }
            }
        }

        // 保存数据到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            localStorage.setItem('categories', JSON.stringify(categories));
        }

        // 渲染所有内容
        function renderAll() {
            renderCategories();
            renderCategoryFilter();
            renderCategoryTags();
            renderBookmarks();
            renderCategoryManagement();
            checkEmptyState();
        }

        // 渲染分类筛选器
        function renderCategoryFilter() {
            categoryFilter.innerHTML = '<option value="all">所有分类</option>';
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // 渲染分类标签
        function renderCategoryTags() {
            categoryTags.innerHTML = '';
            
            const allTag = document.createElement('button');
            allTag.className = 'px-3 py-1 bg-primary text-white rounded-full text-sm flex items-center gap-1';
            allTag.innerHTML = `<i class="fa fa-th"></i> 全部`;
            allTag.addEventListener('click', () => {
                categoryFilter.value = 'all';
                renderBookmarks();
            });
            categoryTags.appendChild(allTag);
            
            categories.forEach(category => {
                const tag = document.createElement('button');
                tag.className = 'px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded-full text-sm flex items-center gap-1 transition-colors';
                tag.innerHTML = `<i class="fa fa-tag"></i> ${category}`;
                tag.addEventListener('click', () => {
                    categoryFilter.value = category;
                    renderBookmarks();
                });
                categoryTags.appendChild(tag);
            });
        }

        // 渲染网址列表
        function renderBookmarks() {
            bookmarkList.innerHTML = '';
            
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;
            
            // 筛选书签
            const filteredBookmarks = bookmarks.filter(bookmark => {
                const matchesSearch = bookmark.name.toLowerCase().includes(searchTerm) || 
                                     bookmark.url.toLowerCase().includes(searchTerm) ||
                                     bookmark.description.toLowerCase().includes(searchTerm);
                                     
                const matchesCategory = selectedCategory === 'all' || bookmark.category === selectedCategory;
                
                return matchesSearch && matchesCategory;
            });
            
            // 按添加时间排序（最新的在前）
            filteredBookmarks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            // 渲染筛选后的书签
            filteredBookmarks.forEach(bookmark => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow';
                
                // 提取域名作为显示用
                let domain = '';
                try {
                    const urlObj = new URL(bookmark.url);
                    domain = urlObj.hostname.replace('www.', '');
                } catch (e) {
                    domain = bookmark.url;
                }
                
                card.innerHTML = `
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-medium text-gray-800 hover:text-primary transition-colors">
                                <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer">${bookmark.name}</a>
                            </h3>
                            <div class="flex gap-1">
                                <button class="edit-btn text-gray-400 hover:text-primary p-1" data-id="${bookmark.id}">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="delete-btn text-gray-400 hover:text-danger p-1" data-id="${bookmark.id}">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mb-2 truncate">
                            <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer">${domain}</a>
                        </p>
                        ${bookmark.description ? `<p class="text-sm text-gray-600 mb-3">${bookmark.description}</p>` : ''}
                        <div class="flex justify-between items-center">
                            <span class="text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded-full">${bookmark.category}</span>
                            <span class="text-xs text-gray-400">${formatDate(bookmark.createdAt)}</span>
                        </div>
                    </div>
                `;
                
                bookmarkList.appendChild(card);
                
                // 添加编辑和删除事件
                card.querySelector('.edit-btn').addEventListener('click', () => editBookmark(bookmark.id));
                card.querySelector('.delete-btn').addEventListener('click', () => deleteBookmark(bookmark.id));
            });
        }

        // 渲染分类管理列表
        function renderCategoryManagement() {
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = '';
            
            categories.forEach(category => {
                // 不能删除"未分类"
                if (category === '未分类') return;
                
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-2 border-b border-gray-100 last:border-0';
                
                // 统计该分类下的网址数量
                const count = bookmarks.filter(b => b.category === category).length;
                
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa fa-folder text-gray-400"></i>
                        <span>${category}</span>
                        <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">${count}</span>
                    </div>
                    <button class="delete-category-btn text-gray-400 hover:text-danger" data-category="${category}">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                
                categoryList.appendChild(item);
                
                // 添加删除分类事件
                item.querySelector('.delete-category-btn').addEventListener('click', (e) => {
                    deleteCategory(e.target.closest('.delete-category-btn').dataset.category);
                });
            });
        }

        // 检查空状态
        function checkEmptyState() {
            if (bookmarks.length === 0) {
                bookmarkList.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                bookmarkList.classList.remove('hidden');
                emptyState.classList.add('hidden');
            }
        }

        // 渲染分类选择器（用于模态框）
        function renderCategories() {
            const categorySelect = document.getElementById('category');
            categorySelect.innerHTML = '';
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        // 显示添加网址模态框
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加网址';
            document.getElementById('bookmarkForm').reset();
            document.getElementById('bookmarkId').value = '';
            document.getElementById('category').value = '未分类';
            bookmarkModal.classList.remove('hidden');
            bookmarkModal.classList.add('flex');
            document.getElementById('name').focus();
        }

        // 显示编辑网址模态框
        function editBookmark(id) {
            const bookmark = bookmarks.find(b => b.id === id);
            if (!bookmark) return;
            
            document.getElementById('modalTitle').textContent = '编辑网址';
            document.getElementById('bookmarkId').value = bookmark.id;
            document.getElementById('name').value = bookmark.name;
            document.getElementById('url').value = bookmark.url;
            document.getElementById('description').value = bookmark.description;
            document.getElementById('category').value = bookmark.category;
            
            bookmarkModal.classList.remove('hidden');
            bookmarkModal.classList.add('flex');
            document.getElementById('name').focus();
        }

        // 保存网址
        function saveBookmark(e) {
            e.preventDefault();
            
            const id = document.getElementById('bookmarkId').value;
            const name = document.getElementById('name').value.trim();
            const url = document.getElementById('url').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value;
            
            // 确保URL以http://或https://开头
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            if (id) {
                // 更新现有网址
                const index = bookmarks.findIndex(b => b.id === parseInt(id));
                if (index !== -1) {
                    bookmarks[index] = {
                        ...bookmarks[index],
                        name,
                        url,
                        description,
                        category
                    };
                    showToast('网址更新成功');
                }
            } else {
                // 添加新网址
                const newId = bookmarks.length > 0 
                    ? Math.max(...bookmarks.map(b => b.id)) + 1 
                    : 1;
                
                bookmarks.push({
                    id: newId,
                    name,
                    url,
                    description,
                    category,
                    createdAt: new Date().toISOString()
                });
                showToast('网址添加成功');
            }
            
            saveToLocalStorage();
            renderAll();
            closeModal();
        }

        // 删除网址
        function deleteBookmark(id) {
            if (confirm('确定要删除这个网址吗？')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                saveToLocalStorage();
                renderAll();
                showToast('网址已删除');
            }
        }

        // 添加分类
        function addCategory() {
            const newCategory = document.getElementById('newCategory').value.trim();
            
            if (!newCategory) {
                showToast('请输入分类名称', 'error');
                return;
            }
            
            if (categories.includes(newCategory)) {
                showToast('该分类已存在', 'error');
                return;
            }
            
            categories.push(newCategory);
            saveToLocalStorage();
            renderAll();
            document.getElementById('newCategory').value = '';
            showToast(`已添加分类: ${newCategory}`);
        }

        // 删除分类
        function deleteCategory(category) {
            if (confirm(`确定要删除分类"${category}"吗？`)) {
                // 将该分类下的网址移至"未分类"
                bookmarks.forEach(bookmark => {
                    if (bookmark.category === category) {
                        bookmark.category = '未分类';
                    }
                });
                
                // 从分类列表中删除
                categories = categories.filter(c => c !== category);
                saveToLocalStorage();
                renderAll();
                showToast(`分类"${category}"已删除`);
            }
        }

        // 关闭模态框
        function closeModal() {
            bookmarkModal.classList.add('hidden');
            bookmarkModal.classList.remove('flex');
            categoryModal.classList.add('hidden');
            categoryModal.classList.remove('flex');
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-md shadow-lg transform translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-2 bg-green-500';
                toastIcon.className = 'fa fa-check-circle text-white';
            } else {
                toast.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-md shadow-lg transform translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-2 bg-danger';
                toastIcon.className = 'fa fa-exclamation-circle text-white';
            }
            
            setTimeout(() => {
                toast.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-md shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2';
            }, 3000);
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // 导出到Excel
        function exportToExcel() {
            if (bookmarks.length === 0) {
                showToast('没有可导出的网址', 'error');
                return;
            }
            
            // 准备导出数据
            const exportData = bookmarks.map(bookmark => ({
                '网站名称': bookmark.name,
                '网址': bookmark.url,
                '说明': bookmark.description,
                '分类': bookmark.category,
                '添加时间': new Date(bookmark.createdAt).toLocaleString('zh-CN')
            }));
            
            // 按分类汇总数据
            const categorySummary = {};
            categories.forEach(category => {
                categorySummary[category] = bookmarks.filter(b => b.category === category).length;
            });
            
            // 创建工作簿
            const wb = XLSX.utils.book_new();
            
            // 添加网址列表工作表
            const ws1 = XLSX.utils.json_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws1, '网址收藏');
            
            // 添加分类汇总工作表
            const summaryData = Object.entries(categorySummary).map(([category, count]) => ({
                '分类': category,
                '网址数量': count
            }));
            const ws2 = XLSX.utils.json_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, ws2, '按分类汇总');
            
            // 导出文件
            const fileName = `网址收藏_${new Date().toLocaleDateString().replace(/\//g, '-')}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast('Excel导出成功');
        }

        // 处理Excel导入
        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 验证文件格式
            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls'].includes(fileExtension)) {
                showToast('请上传Excel格式文件（.xlsx或.xls）', 'error');
                fileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 优先读取"网址收藏"工作表
                    const worksheetName = workbook.SheetNames.includes('网址收藏') 
                        ? '网址收藏' 
                        : workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[worksheetName];
                    
                    // 解析Excel数据
                    const importedData = XLSX.utils.sheet_to_json(worksheet);
                    if (importedData.length === 0) {
                        showToast('Excel文件中无有效数据', 'error');
                        fileInput.value = '';
                        return;
                    }

                    // 处理导入数据
                    let addedCount = 0;
                    let skippedCount = 0;

                    importedData.forEach(item => {
                        // 验证必填字段
                        if (!item['网站名称'] || !item['网址']) return;

                        // 检查是否重复（按网址判断）
                        const isDuplicate = bookmarks.some(bookmark => bookmark.url === item['网址']);
                        if (isDuplicate) {
                            skippedCount++;
                            return;
                        }

                        // 处理分类
                        let category = item['分类'] || '未分类';
                        if (!categories.includes(category)) {
                            categories.push(category);
                        }

                        // 生成新ID
                        const newId = bookmarks.length > 0 
                            ? Math.max(...bookmarks.map(b => b.id)) + 1 
                            : 1;

                        // 添加到收藏列表
                        bookmarks.push({
                            id: newId,
                            name: item['网站名称'].trim(),
                            url: item['网址'].trim(),
                            description: item['说明'] ? item['说明'].trim() : '',
                            category: category.trim(),
                            createdAt: item['添加时间'] 
                                ? new Date(item['添加时间']).toISOString() 
                                : new Date().toISOString()
                        });

                        addedCount++;
                    });

                    // 保存并更新界面
                    saveToLocalStorage();
                    renderAll();

                    // 显示导入结果
                    showToast(`导入完成：新增${addedCount}条，跳过重复${skippedCount}条`, 'success');
                } catch (error) {
                    showToast('导入失败：文件格式错误或数据异常', 'error');
                    console.error('导入错误：', error);
                } finally {
                    fileInput.value = '';
                }
            };

            reader.readAsArrayBuffer(file);
        }

        // 设置事件监听
        function setupEventListeners() {
            // 添加网址按钮
            document.getElementById('addBtn').addEventListener('click', showAddModal);
            document.getElementById('emptyAddBtn').addEventListener('click', showAddModal);
            
            // 关闭模态框
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            
            // 保存网址
            document.getElementById('bookmarkForm').addEventListener('submit', saveBookmark);
            
            // 分类管理
            document.getElementById('categoryManageBtn').addEventListener('click', () => {
                categoryModal.classList.remove('hidden');
                categoryModal.classList.add('flex');
            });
            
            document.getElementById('closeCategoryModal').addEventListener('click', closeModal);
            document.getElementById('closeCategoryBtn').addEventListener('click', closeModal);
            
            // 添加分类
            document.getElementById('addCategoryBtn').addEventListener('click', addCategory);
            document.getElementById('newCategory').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addCategory();
            });
            
            // 筛选和搜索
            categoryFilter.addEventListener('change', renderBookmarks);
            searchInput.addEventListener('input', renderBookmarks);
            
            // 导出Excel
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);

            // 导入Excel相关
            const importBtn = document.getElementById('importBtn');
            const fileInput = document.getElementById('fileInput');

            importBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', handleFileImport);
            
            // 点击模态框外部关闭
            bookmarkModal.addEventListener('click', (e) => {
                if (e.target === bookmarkModal) closeModal();
            });
            
            categoryModal.addEventListener('click', (e) => {
                if (e.target === categoryModal) closeModal();
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
